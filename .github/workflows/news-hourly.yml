name: Hourly News Update

# fetch_bullion_news.py needs a much tighter cadence than the once-daily
# macro-data fetch: Yahoo's RSS feed churns real headlines every 2-8
# minutes during market hours and only holds a rolling recent window, so
# the old once-daily pull was silently missing most of a day's real news
# (confirmed empirically 2026-09-04 -- see
# docs/superpowers/plans/2026-09-04-bullion-mkultra-news-images.md).
# Kept as its own workflow, separate from daily-data.yml, so the FRED
# macro-data fetch (which genuinely doesn't change hourly) isn't dragged
# along for the ride, and so the two workflows never race each other's
# git push on the same files.
#
# Market hours only, weekdays: 13:00-21:00 UTC covers the NYSE session
# (9:30am-4pm ET) with margin on both ends across DST; polling overnight
# or on weekends would just re-fetch the same recycled feed items.
# Minute offset off :00 for the same reason daily-data.yml's cron is
# offset -- GitHub delays jobs scheduled on the hour under load.
on:
  schedule:
    - cron: "11 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        # Pillow -- fetch_bullion_news.py re-encodes each downloaded
        # thumbnail down to a small JPEG (see resize_thumbnail_bytes()).
        # Required because Yahoo's RSS media:content width/height
        # attributes describe the embed display size only, not the
        # actual served file -- the real files run up to several MB and
        # several thousand px per side, which would otherwise blow up
        # this repo's size on every run.
        run: pip install -r bullion-live-map/requirements.txt

      - name: Fetch news headlines for the Markets tab
        # Quality-of-life only, not load-bearing market data -- must not
        # fail this job. A failed RSS fetch leaves the existing news.json
        # and news-images/ untouched; a failed individual image download
        # is caught inside sync_news_images and never aborts the run.
        continue-on-error: true
        run: python3 bullion-live-map/fetch_bullion_news.py

      - name: Commit and push if news changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- bullion-live-map/news.json bullion-live-map/news-images/
          if git diff --cached --quiet; then
            echo "No news changes this run; nothing to commit."
          else
            git commit -m "Update news headlines for $(date -u +%FT%H:%MZ)"
            git push
          fi

      - name: Check news.json freshness
        # Checks the *content* of news.json, not the fetch step's exit
        # code -- exit-code-0-while-writing-to-the-wrong-place is exactly
        # how the pre-existing bug this plan fixes (see Task 1) went
        # unnoticed for 3+ days. Threshold is 6h: generous enough that a
        # couple of missed/flaky hourly runs don't false-alarm, tight
        # enough to catch a real break same business day. Because this
        # step runs after this run's own fetch attempt, a normal
        # overnight/weekend gap never trips it -- if this run's fetch
        # succeeded, generated_at is seconds old regardless of how long
        # the previous gap was; it's only stale if fetching has actually
        # been failing.
        #
        # FIXED 2026-09-28. The paragraph above was right in intent and
        # wrong in execution: it checked generated_at, which this job
        # rewrites on EVERY run whether or not a single headline survived.
        # So the one state it could never detect was the one that happened
        # -- headlines: [] behind a green cron, for days, with no issue ever
        # opened on the news-pipeline-stale label. An empty array is now
        # itself an alarm condition, and the two causes are reported
        # separately because they need different responses:
        #   fetch broken -> re-run / fix the fetcher (our problem)
        #   source stale -> the upstream feed stopped publishing; re-running
        #                   changes nothing and a second feed is the fix
        # See docs/superpowers/bullion-r2-ui-punch-list.md, BUG-A.
        id: freshness
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone

          STALE_AFTER_HOURS = 6
          MAX_AGE_HOURS = 48  # mirrors fetch_bullion_news.MAX_AGE_HOURS

          def parse_ts(raw):
              return datetime.strptime(raw, "%Y-%m-%dT%H:%M:%SZ").replace(
                  tzinfo=timezone.utc)

          try:
              with open("bullion-live-map/news.json") as f:
                  doc = json.load(f)

              now = datetime.now(timezone.utc)
              age_hours = (now - parse_ts(doc["generated_at"])).total_seconds() / 3600
              count = len(doc.get("headlines", []))

              # Pre-filter diagnostics; absent on files written before
              # 2026-09-28, so never assume they are there.
              source_count = doc.get("source_item_count")
              newest_raw = doc.get("newest_item_published")

              # Per-source health FIRST. Once there are several feeds, the
              # aggregate checks below go quiet the moment any one of them is
              # healthy -- so a single frozen source hides behind the others
              # and we are back to the silence this whole gate exists to
              # break, just one level up. A source that returns items but
              # nothing fresh is the exact shape of the 2026-09-24 failure.
              sources = doc.get("sources") or {}
              down    = [s.get("label", k) for k, s in sources.items() if not s.get("ok")]
              empty   = [s.get("label", k) for k, s in sources.items()
                         if s.get("ok") and s.get("fetched") == 0]
              frozen  = [(s.get("label", k), s.get("fetched"), s.get("newest"))
                         for k, s in sources.items()
                         if s.get("ok") and s.get("fetched") and not s.get("fresh")]

              if age_hours > STALE_AFTER_HOURS:
                  stale, reason = True, (
                      f"news.json has not been regenerated for {age_hours:.1f}h "
                      f"(threshold {STALE_AFTER_HOURS}h) -- the fetch step is failing.")
              elif frozen:
                  bits = "; ".join(f"{n} ({f} items, newest {w})" for n, f, w in frozen)
                  stale, reason = True, (
                      f"SOURCE FROZEN: {bits}. Returning items but none inside the "
                      f"{MAX_AGE_HOURS}h window means that feed has stopped being "
                      f"updated. {count} headlines still shipped from the other "
                      f"sources, so the tab looks fine -- it is one vendor going "
                      f"quiet, and it does not come back on its own.")
              elif down:
                  stale, reason = True, (
                      f"SOURCE DOWN: {', '.join(down)} could not be fetched. "
                      f"{count} headlines shipped from the rest.")
              elif empty:
                  stale, reason = True, (
                      f"SOURCE UNPARSEABLE: {', '.join(empty)} fetched but yielded no "
                      f"items -- its feed format has probably changed. {count} "
                      f"headlines shipped from the rest.")
              elif count == 0:
                  if source_count == 0:
                      stale, reason = True, (
                          "The feed returned no items at all. Fetching is broken, "
                          "not merely stale.")
                  elif newest_raw:
                      newest_age = (now - parse_ts(newest_raw)).total_seconds() / 3600
                      stale, reason = True, (
                          f"SOURCE STALE: the feed returned {source_count} items but "
                          f"its newest is {newest_raw} ({newest_age:.0f}h old), past "
                          f"the {MAX_AGE_HOURS}h window, so every one was filtered "
                          f"out. Re-running will not help -- the upstream feed has "
                          f"stopped publishing. Needs a second source.")
                  else:
                      stale, reason = True, (
                          "news.json is fresh but contains zero headlines, and "
                          "carries no pre-filter diagnostics to say why.")
              else:
                  mix = ", ".join(
                      f"{s.get('label', k)} {s.get('contributed', '?')}"
                      for k, s in sources.items()) or "single source"
                  stale, reason = False, (
                      f"{count} headlines, {age_hours:.1f}h old ({mix}).")

              print(f"stale={'true' if stale else 'false'}")
              print(f"age_hours={age_hours:.1f}")
              print(f"headline_count={count}")
              print(f"reason={reason}")
          except Exception as e:
              # Missing file, unparseable JSON, missing/malformed
              # generated_at -- any of these mean the pipeline is broken,
              # not just slow.
              print("stale=true")
              print("age_hours=unknown")
              print("headline_count=unknown")
              print(f"reason=Could not read news.json: {e!r}")
          PY

      - name: Ensure the news-pipeline-stale label exists
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'news-pipeline-stale',
                color: 'd93f0b',
                description: 'Hourly news fetch has not produced fresh data recently',
              });
            } catch (err) {
              if (err.status !== 422) throw err; // 422 = label already exists
            }

      - name: Report staleness to the alarm issue
        if: steps.freshness.outputs.stale == 'true'
        # Values reach the script through env, NOT through `${{ }}`
        # interpolation into the JS source. `reason` is free text and the
        # error path puts repr(e) in it, which routinely contains an
        # apostrophe -- interpolated into a single-quoted JS string that is a
        # syntax error, and it would fire precisely when the alarm is most
        # needed. env keeps it data.
        env:
          AGE_HOURS: ${{ steps.freshness.outputs.age_hours }}
          HEADLINE_COUNT: ${{ steps.freshness.outputs.headline_count }}
          REASON: ${{ steps.freshness.outputs.reason }}
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const ageHours = process.env.AGE_HOURS;
            const headlineCount = process.env.HEADLINE_COUNT;
            const reason = process.env.REASON;
            const now = new Date().toISOString();
            const body = [
              `**${now}** — the Markets tab has no usable news.`,
              ``,
              `**What is wrong:** ${reason}`,
              ``,
              `| | |`,
              `|---|---|`,
              `| headlines in news.json | **${headlineCount}** |`,
              `| news.json age | ${ageHours}h (threshold 6h) |`,
              `| run | ${runUrl} |`,
              ``,
              `Note that a zero-headline run still reports \`success\` and still`,
              `commits — \`generated_at\` is rewritten every run. That is why this`,
              `alarm checks the headline count, not the timestamp.`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'news-pipeline-stale',
            });

            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'News pipeline has gone stale',
                body,
                labels: ['news-pipeline-stale'],
                assignees: [context.repo.owner],
              });
            } else {
              // Each stale run comments rather than opening a duplicate,
              // same pattern as daily-data.yml's own alarm.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body,
              });
            }

      - name: Close the news-pipeline-stale issue on recovery
        if: steps.freshness.outputs.stale == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'news-pipeline-stale',
            });
            const now = new Date().toISOString();
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered — news.json is fresh again as of ${now}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
              });
            }
